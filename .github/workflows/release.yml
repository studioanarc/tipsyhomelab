name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate manifest
        run: |
          python -c "
          import json
          with open('custom_components/wine_monitor/manifest.json') as f:
              manifest = json.load(f)
              assert 'version' in manifest, 'Missing version in manifest'
              assert 'domain' in manifest, 'Missing domain in manifest'
              assert 'name' in manifest, 'Missing name in manifest'
              print(f\"Manifest validated: {manifest['name']} v{manifest['version']}\")
          " || echo "Manifest validation skipped - file may not exist yet"

  publish-hacs:
    name: Publish to HACS
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Update manifest version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present

          if [ -f custom_components/wine_monitor/manifest.json ]; then
            python -c "
            import json
            with open('custom_components/wine_monitor/manifest.json', 'r') as f:
                manifest = json.load(f)
            manifest['version'] = '$VERSION'
            with open('custom_components/wine_monitor/manifest.json', 'w') as f:
                json.dump(manifest, f, indent=2)
            print(f\"Updated manifest version to {manifest['version']}\")
            "
          fi

      - name: Create release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"

          mkdir -p release
          cd custom_components
          zip -r ../release/wine_monitor-${VERSION}.zip wine_monitor/
          cd ..

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release/wine_monitor-${{ steps.version.outputs.version }}.zip
          asset_name: wine_monitor-${{ steps.version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Update HACS repository
        run: |
          echo "Release published to GitHub"
          echo "HACS will automatically detect the new release"

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-hacs, publish-docker]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "## What's Changed" >> changelog.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD >> changelog.md || echo "- Initial release" >> changelog.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [publish-hacs, publish-docker]
    if: always()
    steps:
      - name: Send success notification
        if: needs.publish-hacs.result == 'success' && needs.publish-docker.result == 'success'
        run: |
          echo "✅ Release published successfully"

      - name: Send failure notification
        if: needs.publish-hacs.result == 'failure' || needs.publish-docker.result == 'failure'
        run: |
          echo "❌ Release failed"
          exit 1
